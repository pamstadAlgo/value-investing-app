<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>InvestSmart - Login</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "rgb(79 70 229)",
              "background-light": "#f0f2f5",
              "background-dark": "#0d1117",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        --background-color: #f0f2f5;
        --background-gradient: radial-gradient(
            at 0% 0%,
            hsla(243, 86%, 95%, 0.4) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            hsla(289, 86%, 95%, 0.4) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 0% 100%,
            hsla(189, 86%, 95%, 0.4) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 80% 90%,
            hsla(330, 86%, 95%, 0.4) 0px,
            transparent 50%
          );
        background-color: var(--background-color);
        background-image: var(--background-gradient);
        position: relative;
        overflow: hidden;
      }
      .dark body {
        --background-color: #0d1117;
        --background-gradient: radial-gradient(
            at 0% 0%,
            hsla(243, 86%, 15%, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            hsla(289, 86%, 15%, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 0% 100%,
            hsla(189, 86%, 15%, 0.2) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 80% 90%,
            hsla(330, 86%, 15%, 0.2) 0px,
            transparent 50%
          );
      }
      .background-chart {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80vh;
        pointer-events: none;
        z-index: 0;
      }
      .background-chart svg {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .dark .background-chart {
        opacity: 0.2;
      }
      .candle-shimmer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 4s infinite linear;
        opacity: 0.1;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body class="font-display bg-background-light dark:bg-background-dark">
    <div class="background-chart">
      <svg
        class="w-full h-full opacity-30"
        fill="none"
        preserveAspectRatio="none"
        viewBox="0 0 1440 700"
        xmlns="http://www.w3.org/2000/svg">
        <g
          stroke="rgb(79 70 229)"
          stroke-width="4"
          transform="translate(0, 700) scale(1, -1)">
          <g transform="translate(60, 0)">
            <line x1="0" x2="0" y1="80" y2="280"></line>
            <rect
              fill="rgb(79 70 229)"
              height="170"
              rx="5"
              style="transform: scaleY(1.3); transform-origin: bottom"
              width="70"
              x="-35"
              y="80"></rect>
            <foreignObject
              height="280"
              style="transform: scaleY(1.3); transform-origin: bottom"
              width="70"
              x="-35"
              y="80">
              <div class="w-full h-full overflow-hidden relative">
                <div class="candle-shimmer"></div>
              </div>
            </foreignObject>
          </g>
          <script>
            const candleContainer = document.currentScript.parentElement; const
            candleWidth = 50; const candleSpacing = 70; let x = 60 +
            candleSpacing; for (let i = 1; i < 20; i++) { const open = 50 + i *
            25 + Math.random() * 50; const close = open + 40 + Math.random() *
            80; const high = close + Math.random() * 60; const low = open -
            Math.random() * 30; const candle =
            document.createElementNS("http://www.w3.org/2000/svg", "g");
            candle.setAttribute("transform", `translate(${x} 0)`); const wick =
            document.createElementNS("http://www.w3.org/2000/svg", "line");
            wick.setAttribute("x1", "0"); wick.setAttribute("x2", "0");
            wick.setAttribute("y1", low); wick.setAttribute("y2", high);
            candle.appendChild(wick); const body =
            document.createElementNS("http://www.w3.org/2000/svg", "rect");
            body.setAttribute("fill", "rgb(79 70 229)");
            body.setAttribute("height", close - open); body.setAttribute("rx",
            "5"); body.setAttribute("width", candleWidth);
            body.setAttribute("x", -candleWidth / 2); body.setAttribute("y",
            open); candle.appendChild(body);
            candleContainer.appendChild(candle); x += candleSpacing; }
          </script>
        </g>
      </svg>
    </div>
    <div
      class="relative flex flex-col items-center justify-center min-h-screen p-4 z-10">
      <div class="w-full max-w-md">
        <div class="flex justify-center mb-6">
          <a
            class="flex items-center gap-3 text-gray-800 dark:text-white"
            href="#">
            <svg
              class="h-8 w-8 text-primary"
              fill="none"
              viewBox="0 0 48 48"
              xmlns="http://www.w3.org/2000/svg">
              <path
                clip-rule="evenodd"
                d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z"
                fill="currentColor"
                fill-rule="evenodd"></path>
            </svg>
            <span class="text-2xl font-bold">InvestSmart</span>
          </a>
        </div>
        <div
          class="bg-white/80 dark:bg-background-dark/80 backdrop-blur-sm p-8 shadow-lg rounded-xl border border-gray-200 dark:border-gray-700">
          <h1
            class="text-2xl font-bold text-center text-gray-900 dark:text-white mb-2">
            Welcome Back
          </h1>
          <p class="text-center text-gray-500 dark:text-gray-400 mb-8">
            Login to access your financial dashboard.
          </p>
          <form class="space-y-6">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 sr-only"
                for="username"
                >Username</label
              >
              <input
                class="w-full px-4 py-3 rounded-lg bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white focus:ring-primary focus:border-primary placeholder-gray-400 dark:placeholder-gray-500"
                id="username"
                name="username"
                placeholder="Username"
                required=""
                type="text" />
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 sr-only"
                for="password"
                >Password</label
              >
              <input
                class="w-full px-4 py-3 rounded-lg bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white focus:ring-primary focus:border-primary placeholder-gray-400 dark:placeholder-gray-500"
                id="password"
                name="password"
                placeholder="Password"
                required=""
                type="password" />
            </div>
            <div class="flex items-center justify-end">
              <a
                class="text-sm font-medium text-primary hover:underline"
                href="#"
                >Forgot Password?</a
              >
            </div>
            <button
              class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
              type="submit">
              Sign In
            </button>
          </form>
          <div class="mt-6">
            <div class="relative">
              <div class="absolute inset-0 flex items-center">
                <div
                  class="w-full border-t border-gray-300 dark:border-gray-600"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span
                  class="px-2 bg-white/80 dark:bg-background-dark/80 backdrop-blur-sm text-gray-500 dark:text-gray-400"
                  >Or continue with</span
                >
              </div>
            </div>
            <div class="mt-6">
              <a
                class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700"
                href="#">
                <svg
                  aria-hidden="true"
                  class="w-5 h-5"
                  fill="currentColor"
                  viewBox="0 0 20 20">
                  <path
                    clip-rule="evenodd"
                    d="M10 0C4.477 0 0 4.477 0 10c0 4.418 2.865 8.165 6.839 9.49.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.602-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.942 0-1.091.39-1.984 1.03-2.682-.103-.253-.446-1.272.098-2.657 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0110 5.844c.85.004 1.705.115 2.504.336 1.909-1.296 2.747-1.027 2.747-1.027.546 1.385.202 2.404.1 2.657.64.698 1.028 1.59 1.028 2.682 0 3.838-2.339 4.685-4.566 4.935.359.308.678.92.678 1.852 0 1.334-.012 2.41-.012 2.737 0 .267.18.577.688.482A10.001 10.001 0 0020 10c0-5.523-4.477-10-10-10z"
                    fill-rule="evenodd"></path>
                </svg>
                <span class="ml-3">Sign in with Google</span>
              </a>
            </div>
          </div>
        </div>
        <p class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
          Don't have an account?
          <a class="font-medium text-primary hover:underline" href="#"
            >Sign Up</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
