server {
  listen 80;
  server_name _;

  # Where the React build lives
  root /usr/share/nginx/html;
  index index.html;

  # Redirect trailing slash callback to canonical path (optional but recommended)
  location = /google-auth/callback/ {
    return 301 /google-auth/callback$is_args$args;
  }

  # SPA fallback for all routes
  location / {
    # Debug header so we can verify this config is active
    add_header X-Nginx-Config "spa-fallback-v4" always;

    try_files $uri $uri/ /index.html;
  }
}