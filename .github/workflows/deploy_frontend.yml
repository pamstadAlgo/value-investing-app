name: Deploy Frontend

# on:
#     push:
#         branches:
#             - main
#         paths:
#             - "value-investing-frontend/value-investing/**"
# Trigger manually only
on:
  workflow_dispatch:


jobs:
    frontend-deploy:
        uses: ./.github/workflows/deploy_railway.yml
        with:
            image_name: ${{ vars.DOCKER_FRONTEND_IMG_NAME }}
            image_tag: ${{ vars.BACKEND_IMG_TAG }}
            context_path: ./value-investing-frontend/value-investing/
        secrets:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
            RAILWAY_SVC_ID: ${{ secrets.RAILWAY_FRONTEND_SVC_ID }}
