name: Deploy Frontend

on:
    push:
        branches:
            - main
        paths:
            - "value-investing-frontend/value-investing/**"

jobs:
    frontend-deploy:
        uses: ./.github/workflows/deploy_ecs.yml
        with:
            ecr_image: ${{ vars.ECR_FRONTEND_IMAGE }}
            ecs_service: ${{ vars.ECS_FRONTEND_SERVICE }}
            context_path: ./value-investing-frontend/value-investing/
        secrets:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
