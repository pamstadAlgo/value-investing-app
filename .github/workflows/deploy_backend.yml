name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "value-investing-backend/valueinvesting/**"
  workflow_dispatch:

jobs:
  backend-deploy:
    uses: ./.github/workflows/deploy_railway.yml
    with:
      image_name: ${{ vars.DOCKER_BACKEND_IMG_NAME }}
      image_tag: ${{ vars.BACKEND_IMG_TAG }}
      context_path: ./value-investing-backend/valueinvesting/
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
      RAILWAY_SVC_ID: ${{ secrets.RAILWAY_BACKEND_SVC_ID }}
