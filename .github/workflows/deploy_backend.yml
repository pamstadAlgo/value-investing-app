name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "value-investing-backend/valueinvesting/**"

jobs:
  backend-deploy:
    uses: ./.github/workflows/deploy_ecs.yml
    with:
      ecr_image: ${{ vars.ECR_BACKEND_IMAGE }}
      ecs_service: ${{ vars.ECS_BACKEND_SERVICE }}
      context_path: ./value-investing-backend/valueinvesting/
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
