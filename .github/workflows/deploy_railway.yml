name: Build Docker Image, push to Dockerhub and deploy Railway Service

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      context_path:
        required: true
        type: string

    secrets:
      RAILWAY_TOKEN:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PWD:
        required: true
      RAILWAY_SVC_ID:
        required: true
      RAILWAY_ENV_ID:
        required: true      
      RAILWAY_SVC2_ID:
        required: false
      # AWS_ACCESS_KEY_ID:
      #   required: true
      # AWS_SECRET_ACCESS_KEY:
      #   required: true
      # AWS_ACCOUNT_ID:
      #   required: true

jobs:
  # build and push docker image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Add as GitHub secret
          password: ${{ secrets.DOCKER_PWD }} # Add as GitHub secret

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.image_tag }}

  # Redeploy Railway (depends on the first job)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Trigger Railway deploy (new deployment)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SVC_ID: ${{ secrets.RAILWAY_SVC_ID }}
          RAILWAY_ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          curl https://backboard.railway.app/graphql/v2 \
            -X POST \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "query": "mutation ($serviceId: String!, $environmentId: String!) { serviceInstanceDeploy(serviceId: $serviceId, environmentId: $environmentId) }",
              "variables": {
                "serviceId": "'"${RAILWAY_SVC_ID}"'",
                "environmentId": "'"${RAILWAY_ENV_ID}"'"
              }
            }'
