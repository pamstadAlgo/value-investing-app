name: Build Docker Image, push to Dockerhub and deploy Railway Service

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      context_path:
        required: true
        type: string

    secrets:
      RAILWAY_TOKEN:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PWD:
        required: true
      RAILWAY_SVC_ID:
        required: true
      RAILWAY_SVC2_ID:
        required: false
      # AWS_ACCESS_KEY_ID:
      #   required: true
      # AWS_SECRET_ACCESS_KEY:
      #   required: true
      # AWS_ACCOUNT_ID:
      #   required: true

jobs:
  # build and push docker image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Add as GitHub secret
          password: ${{ secrets.DOCKER_PWD }} # Add as GitHub secret

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.image_tag }}

  # Redeploy Railway (depends on the first job)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    container: ghcr.io/railwayapp/cli:latest

    steps:
      - name: Redeploy Railway service
        run: |
          railway redeploy --service=${{ secrets.RAILWAY_SVC_ID }} --yes
          # Redeploy second service if provided
          if [ -n "${{ secrets.RAILWAY_SVC2_ID }}" ]; then
            echo "RAILWAY_SVC2_ID is set, redeploying second service..."
            railway redeploy --service=${{ secrets.RAILWAY_SVC2_ID }} --yes
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
